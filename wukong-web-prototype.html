<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>诚迈悟空 · 网页版</title>
<style>
  :root {
    --bg: #f3f1eb;
    --side: #ebe7df;
    --paper: #fbfaf6;
    --ink: #1e1b17;
    --muted: #6f675e;
    --faint: #8a8176;
    --line: #e3dcd1;
    --line-strong: #d4cbbf;
    --accent: #0e5c68;
    --accent-ink: #084852;
    --accent-soft: #e5f2f3;
    --accent-line: #c5e0e3;
    --user: #e7eef0;
    --warn: #8a3d12;
    --warn-soft: #f8efe6;
    --good: #1d6b45;
    --good-soft: #e7f4ec;
    --danger: #8f2d2d;
    --shadow: 0 16px 40px rgba(40, 32, 22, 0.12);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", serif;
    --sans: "Noto Sans SC", "WenQuanYi Micro Hei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    --side-w: 268px;
    --panel-w: 400px;
    --radius: 10px;
  }
  html[data-theme="ink"] {
    --bg: #141311;
    --side: #1b1916;
    --paper: #211f1c;
    --ink: #f4efe8;
    --muted: #b7aea3;
    --faint: #8f877d;
    --line: #34302a;
    --line-strong: #463f36;
    --accent: #8fd0cb;
    --accent-ink: #d7f4f1;
    --accent-soft: #1b3032;
    --accent-line: #2d4c4e;
    --user: #2a3336;
    --warn: #f0c09a;
    --warn-soft: #3a2b22;
    --good: #9ddec0;
    --good-soft: #1a3126;
    --danger: #f0b4b4;
    --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.55;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .app { height: 100%; height: 100dvh; display: flex; min-width: 0; overflow: hidden; }
  .main { position: relative; }
  .sidebar {
    width: var(--side-w);
    flex: none;
    background: var(--side);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .side-top, .side-foot { padding: 14px 12px 10px; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 2px 6px 12px;
  }
  .mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--accent); color: #f7fffe;
    display: grid; place-items: center;
    font-family: var(--serif); font-weight: 650; font-size: 16px;
  }
  html[data-theme="ink"] .mark { color: #102022; }
  .brand strong { display: block; font-size: 14px; font-weight: 650; letter-spacing: 0.01em; }
  .brand small { color: var(--muted); font-size: 12px; }
  .primary, .ghost, .soft, .textbtn {
    border: 1px solid transparent; background: transparent; border-radius: 8px;
  }
  .primary {
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--ink); color: var(--paper);
    padding: 8px 10px; font-weight: 600;
  }
  .sidebar .primary { justify-content: flex-start; }
  html[data-theme="ink"] .primary { background: var(--accent); color: #102022; }
  .ghost {
    border-color: var(--line-strong); background: var(--paper);
    padding: 7px 10px;
  }
  .soft { background: var(--accent-soft); color: var(--accent-ink); padding: 6px 10px; }
  .textbtn { color: var(--muted); padding: 4px 6px; }
  .textbtn:hover, .nav:hover, .thread:hover, .side-link:hover { background: rgba(30, 27, 23, 0.05); }
  html[data-theme="ink"] .textbtn:hover,
  html[data-theme="ink"] .nav:hover,
  html[data-theme="ink"] .thread:hover,
  html[data-theme="ink"] .side-link:hover { background: rgba(255,255,255,0.05); }
  .search {
    margin: 8px 0 4px; display: flex; align-items: center; gap: 6px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
  }
  .search input { border: 0; outline: none; width: 100%; background: transparent; }
  .search kbd, .hint kbd {
    font-family: var(--sans); font-size: 11px; color: var(--faint);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px;
  }
  .ws { position: relative; margin: 8px 0; }
  .ws > button {
    width: 100%; display: flex; gap: 8px; align-items: center;
    text-align: left; background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 8px;
  }
  .ws small { display: block; color: var(--muted); }
  .ws-menu {
    position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--paper); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: var(--shadow); padding: 6px;
  }
  .ws-menu button, .menu button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    border-radius: 7px; padding: 7px 8px;
  }
  .ws-menu button.on, .menu button:hover { background: var(--accent-soft); }
  .library { padding: 0 8px 6px; border-bottom: 1px solid var(--line); }
  .library .label { padding-top: 2px; }
  .library .side-link { padding: 5px 8px; }
  .scroll { overflow: auto; min-height: 0; flex: 1; padding: 0 8px 8px; }
  .label { color: var(--faint); font-size: 12px; padding: 10px 8px 4px; }
  .thread, .side-link, .nav {
    width: 100%; display: flex; gap: 8px; align-items: center;
    text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 7px 8px;
  }
  .thread.on, .side-link.on, .nav.on { background: var(--paper); }
  .thread .t { min-width: 0; flex: 1; }
  .thread strong, .side-link span, .nav span { display: block; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread em { display: block; font-style: normal; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    display: grid; place-items: center; font-size: 12px; background: var(--accent-soft); color: var(--accent-ink);
  }
  .side-foot { border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #c9b59a; color: #2b241c;
    display: grid; place-items: center; font-weight: 650; flex: none;
  }
  .side-foot .who { flex: 1; min-width: 0; }
  .side-foot strong { display: block; }
  .side-foot small { color: var(--muted); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  .topbar {
    height: 52px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 16px; border-bottom: 1px solid var(--line);
  }
  .topbar > div { min-width: 0; }
  .topbar h1 { font-size: 15px; font-weight: 650; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar p { margin: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .iconbtn {
    border: 1px solid transparent; background: transparent; border-radius: 8px;
    padding: 6px 8px; color: var(--muted);
  }
  .iconbtn:hover { background: rgba(30,27,23,0.05); }
  .stage { flex: 1; min-height: 0; display: flex; }
  .transcript { flex: 1; min-width: 0; overflow: auto; display: flex; flex-direction: column; }
  .col { width: min(780px, 100%); margin: 0 auto; padding: 28px 28px 12px; }
  .col.empty { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .empty h2 { font-family: var(--serif); font-size: 32px; font-weight: 600; margin: 0 0 8px; letter-spacing: 0.01em; }
  .empty .greet { color: var(--muted); margin: 0 0 18px; }
  .suggests { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .suggests button, .follow button, .chips button, .seg button, .choice {
    text-align: left; border: 1px solid var(--line); background: var(--paper);
    border-radius: 10px; padding: 10px 12px;
  }
  .suggests button:hover, .follow button:hover, .choice:hover { border-color: var(--accent-line); }
  .suggests small { display: block; color: var(--faint); }
  .msg { margin: 0 0 22px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .bubble {
    max-width: 86%; background: var(--user); border-radius: 12px; padding: 10px 14px; white-space: pre-wrap;
  }
  .who-line { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .piece h3 { font-family: var(--serif); font-size: 26px; line-height: 1.35; margin: 6px 0 8px; }
  .lead { margin: 0; }
  blockquote { margin: 8px 0; padding-left: 12px; border-left: 2px solid var(--accent); color: var(--accent-ink); }
  .actions, .follow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .task, .cite, .handoff, .pagecard, .perm {
    border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 14px;
  }
  .kicker { color: var(--accent-ink); font-size: 12px; font-weight: 650; }
  .task h3, .cite h3, .pagecard h3 { margin: 4px 0 6px; font-size: 16px; }
  .meta { color: var(--muted); margin: 0; }
  .cost { font-variant-numeric: tabular-nums; margin: 8px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .cite li { margin: 4px 0; }
  .srcbtn { border: 0; background: transparent; color: var(--accent-ink); padding: 0; text-decoration: underline; cursor: pointer; }
  .composer-wrap { flex: none; padding: 0 28px 16px; }
  .composer-inner { max-width: 780px; margin: 0 auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chips button { padding: 4px 10px; border-radius: 999px; background: transparent; }
  .chips button.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
  .composer {
    background: var(--paper); border: 1px solid var(--line-strong); border-radius: 14px; padding: 8px;
  }
  .composer textarea {
    width: 100%; border: 0; resize: none; outline: none; background: transparent;
    min-height: 48px; max-height: 160px; padding: 6px 6px 0;
  }
  .composer-bar { display: flex; align-items: center; gap: 4px; }
  .hint { margin: 6px 2px 0; color: var(--faint); font-size: 12px; }
  .send {
    margin-left: auto; background: var(--accent); color: #f4fffe; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 650;
  }
  html[data-theme="ink"] .send { color: #102022; }
  .send:disabled { opacity: 0.4; cursor: default; }
  .panel {
    width: var(--panel-w); flex: none; background: var(--paper);
    border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  }
  .panel header, .page-head {
    height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .panel header strong { font-size: 14px; }
  .panel .body { overflow: auto; padding: 14px; flex: 1; min-height: 0; }
  .tabs { display: flex; gap: 4px; padding: 0 0 12px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 6px 8px; }
  .tabs button.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 650; }
  .field { margin: 0 0 12px; }
  .field span, .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px;
  }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .choice.on { border-color: var(--accent); background: var(--accent-soft); }
  .choice b { display: block; font-weight: 600; }
  .choice i { display: block; font-style: normal; color: var(--muted); font-size: 12px; }
  .upload {
    border: 1px dashed var(--line-strong); border-radius: 10px; padding: 14px; color: var(--muted); text-align: center;
  }
  .sticky-cta {
    flex: none; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--paper);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .page { flex: 1; min-width: 0; overflow: auto; }
  .page-inner { padding: 22px 28px 40px; }
  .page h2 { margin: 0; font-size: 22px; }
  .sub { color: var(--muted); margin: 4px 0 16px; }
  .filters { display: flex; gap: 6px; margin-bottom: 14px; }
  .filters button, .subnav button {
    border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 10px;
  }
  .filters button.on, .subnav button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  html[data-theme="ink"] .filters button.on, html[data-theme="ink"] .subnav button.on { background: var(--accent); color: #102022; border-color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .card {
    text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 14px;
  }
  .card:hover { border-color: var(--accent-line); }
  .card h3 { margin: 8px 0 4px; font-size: 16px; }
  .card p { margin: 0; color: var(--muted); min-height: 44px; }
  .tag { display: inline-block; font-size: 12px; color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; }
  .tag.warn { color: var(--warn); background: var(--warn-soft); }
  .tag.muted { color: var(--muted); background: transparent; border: 1px solid var(--line); }
  .works { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .work { border: 0; padding: 0; background: transparent; text-align: left; }
  .art {
    height: 168px; border-radius: 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 4px; padding: 12px;
    color: #f7f4ee;
  }
  .art span { font-size: 12px; opacity: 0.8; }
  .art b { font-size: 16px; font-weight: 650; }
  .work small, .taskline small { color: var(--muted); }
  .taskline {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
    border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  }
  .bar { height: 4px; background: var(--line); border-radius: 99px; grid-column: 1 / -1; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .split { display: grid; grid-template-columns: 180px 1fr; gap: 22px; }
  .detail { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 22px; align-items: start; }
  .subnav { display: flex; flex-direction: column; gap: 4px; }
  .subnav button { border-radius: 8px; text-align: left; }
  .stat {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 16px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); margin-bottom: 12px;
  }
  .stat b { font-family: var(--serif); font-size: 32px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--paper); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: 450; }
  th { color: var(--muted); font-size: 12px; }
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .notice {
    position: absolute; right: 16px; top: 48px; width: 320px; z-index: 6;
    background: var(--paper); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); padding: 8px;
  }
  .notice button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px; }
  .notice button strong { display: block; }
  .notice button span { color: var(--muted); }
  .modal-back {
    position: fixed; inset: 0; background: rgba(24, 20, 16, 0.46);
    display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  .modal { width: min(520px, calc(100vw - 40px)); background: var(--paper); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  .modal h3 { margin: 0 0 6px; font-size: 18px; }
  .call { text-align: center; padding: 12px 8px 4px; }
  .call .pulse {
    width: 72px; height: 72px; margin: 8px auto 10px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: #f4fffe; font-family: var(--serif); font-size: 28px;
  }
  html[data-theme="ink"] .call .pulse { color: #102022; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: 0.18s ease; z-index: 40;
  }
  html[data-theme="ink"] #toast { background: var(--accent); color: #102022; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .switch { width: 36px; height: 22px; border-radius: 99px; border: 0; background: var(--line-strong); position: relative; }
  .switch.on { background: var(--accent); }
  .switch i { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: white; }
  .switch.on i { left: 17px; }
  .perm-row, .list-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .partner-card { display: flex; flex-direction: column; align-items: stretch; cursor: default; }
  .partner-card:hover { border-color: var(--line); }
  .partner-card h3 { margin-top: 10px; }
  .partner-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .partner-av {
    width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
    background: var(--accent); color: #f4fffe; font-family: var(--serif); font-size: 20px; flex: none;
  }
  html[data-theme="ink"] .partner-av { color: #102022; }
  .claim { margin-top: 12px; width: 100%; border-radius: 999px; }
  .claim.owned, html[data-theme="ink"] .claim.owned { background: transparent; color: var(--accent-ink); border: 1px solid var(--accent-line); }
  .claim:disabled { opacity: 0.55; cursor: default; }
  .home-scroll { flex: 1; min-height: 0; overflow: auto; }
  .home-stage {
    min-height: calc(100vh - 52px - 56px);
    min-height: calc(100dvh - 52px - 56px);
    display: flex; flex-direction: column;
    box-sizing: border-box; padding: 36px 28px 8px;
  }
  .home-hero {
    width: min(780px, 100%); margin: 0 auto; flex: 1;
    display: flex; flex-direction: column; justify-content: center;
  }
  .home-hero h2 { font-family: var(--serif); font-size: 34px; font-weight: 600; margin: 0 0 10px; letter-spacing: 0.01em; }
  .home-hero .greet { color: var(--muted); margin: 0 0 28px; }
  .home-hero .suggests { gap: 12px; }
  .home-composer { width: min(780px, 100%); margin: 28px auto 0; flex: none; }
  .yt-bar {
    position: sticky; top: 0; z-index: 5; flex: none;
    display: flex; align-items: center; gap: 8px;
    height: 56px; padding: 0 16px 0 20px;
    background: var(--bg); border-bottom: 1px solid var(--line);
    box-shadow: 0 8px 16px rgba(40, 32, 22, 0.05);
  }
  .yt-bar-scroll {
    display: flex; gap: 12px; overflow-x: auto; flex: 1; min-width: 0;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent);
  }
  .yt-bar-scroll::-webkit-scrollbar { display: none; }
  .yt-chip {
    flex: none; height: 32px; padding: 0 12px; border: 0; border-radius: 8px;
    background: rgba(30, 27, 23, 0.06); color: var(--ink);
    font-size: 14px; font-weight: 550; line-height: 32px; white-space: nowrap;
  }
  .yt-chip.on { background: var(--ink); color: var(--paper); }
  .yt-chip:hover { background: rgba(30, 27, 23, 0.12); }
  .yt-chip.on:hover { background: var(--ink); }
  html[data-theme="ink"] .yt-chip { background: rgba(255,255,255,.1); }
  html[data-theme="ink"] .yt-chip:hover { background: rgba(255,255,255,.16); }
  html[data-theme="ink"] .yt-chip.on, html[data-theme="ink"] .yt-chip.on:hover { background: var(--ink); color: #141311; }
  .yt-bar-next, .yt-bar-down {
    flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0;
    display: grid; place-items: center;
  }
  .yt-bar-next { background: var(--paper); color: var(--ink); box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  .yt-bar-down { background: var(--ink); color: var(--paper); }
  html[data-theme="ink"] .yt-bar-down { color: #141311; }
  .plaza-wrap { width: 100%; margin: 0; padding: 16px 28px 48px; box-sizing: border-box; min-height: calc(100dvh - 52px - 56px); }
  .plaza-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 8px 0 14px; }

  if (!agent || agent.retired) { toast("这个智能体已下架"); return; }
  if (!agent.owned) { openPartner(id); return; }
  let thread = state.threads.find(t => t.agentId === id && (t.workspace || "personal") === state.workspace && t.messages.length);
  if (!thread) {
    thread = { id:"t-" + uid(), agentId:id, title:agent.name, preview:agent.greet, time:"刚刚", group:"今天", pinned:false, workspace: state.workspace === "personal" ? undefined : state.workspace, messages:[] };
    state.threads.unshift(thread);
  }
  state.panel = id === "creator" ? "studio" : id === "knowledge" ? null : null;
  go("#/chat/" + thread.id + (id === "creator" ? "?panel=studio&tab=image" : ""));
}
function subscribe(id) {
  const agent = AGENTS[id];
  if (!agent || agent.retired) return;
  if (agent.owned) { openAgent(id); return; }
  if (!agent.cost) {
    agent.owned = true;
    toast("已领取「" + agent.name + "」");
    state.partnerId = id;
    state.modal = "partner";
    render();
    return;
  }
  if (state.beans < agent.cost) { state.modal = "recharge"; toast("龙豆不足，先看看档位"); render(); return; }
  state.beans -= agent.cost;
  agent.owned = true;
  state.records.unshift({ title:"领取 " + agent.name, amount:-agent.cost, time:"刚刚" });
  toast("已领取「" + agent.name + "」");
  state.partnerId = id;
  state.modal = "partner";
  render();
}
function costOfStudio() {
  if (state.studioTab === "image" || state.studioTab === "retouch") return 2700 * state.count;
  if (state.studioTab === "film") return 12000 * state.duration;
  return 60000;
}
function studioMeta() {
  if (state.studioTab === "image") return `${state.count} 张 · ${state.ratio} · ${state.clarity}`;
  if (state.studioTab === "retouch") return `${state.count} 张 · ${state.clarity}`;
  if (state.studioTab === "film") return `1 条 · ${state.duration} 秒 · ${state.ratio} · 720P`;
  return `1 条 · ${state.ratio} · 720P`;
}
function skillName() {
  return { image:"图片创作", retouch:"AI 修图", film:"一键成片", mix:"智能混剪" }[state.studioTab];
}
function needsVip() { return state.studioTab === "film" || state.studioTab === "mix"; }

function makeReply(agentId, text) {
  if ((agentId === "wukong" || agentId === "wuqiong") && /图|视频|修图|混剪|成片|海报/.test(text)) {
    return { role:"ai", kind:"handoff", text:"出图和出片在创作小助手里完成。过去之后，张数、比例和龙豆会先给你确认。", prompt:text };
  }
  if (agentId === "creator") {
    const tab = /修图|衣服|婚服|汉服/.test(text) ? "retouch" : /混剪|素材/.test(text) ? "mix" : /视频|成片|秒/.test(text) ? "film" : "image";
    state.studioTab = tab;
    state.panel = "studio";
    return { role:"ai", kind:"task", skill:tab, title:text.slice(0, 32), meta:studioMeta(), cost:costOfStudio(), phase:"confirm" };
  }
  if (agentId === "knowledge" || /报销|制度|合同|入职|请假/.test(text)) {
    state.panel = "sources";
    return { role:"ai", kind:"cite", title:"按资料原文回答", body:"已在企业知识库里找到相关条款。报销、审批和材料位置都以引用为准，没有写到的标准我不会补。", note:"需要哪一条原文，直接点右侧材料。", sources:["差旅管理办法 · 第三条","员工手册 · 请假与入职","产品方案 · 交付与报价口径"] };
  }
  if (text.includes("文艺")) return { role:"ai", kind:"article", lead:"好，收得更轻一点。", title:"南京 · 给晚风留一盏灯", quote:"城还在，灯也还在。", body:"秦淮河并不吵，它只是把白天没说完的话，换成灯影。你沿着石栏慢慢走，梧桐的影子比人先到桥上。", follows:["再短一点","换成海报描述"] };
  if (text.includes("冷门") || text.includes("打卡")) return { role:"ai", kind:"text", text:"三个本地人会拐进去的地方：\n\n1. 颐和路的法国梧桐，适合傍晚散步，不必打卡拍照。\n2. 先锋书店地下车库，带上一本书就够。\n3. 老门东靠里的小巷，鸭血粉丝汤比主街那几家安静。" };
  if (text.includes("会议") || text.includes("纪要")) return { role:"ai", kind:"text", text:"先按三栏收：决定、待办、还没定的问题。你把会议里的原话贴过来，我按这三栏整理，不另加没说过的结论。" };
  if (text.includes("Java")) return { role:"ai", kind:"text", text:"系统学 Java 一般分四个阶段：语法、面向对象、集合与并发、工程实践。告诉我你现在在哪一段，我按每天一小时来排。" };
  if (/南京/.test(text) && /文案|旅行|介绍/.test(text)) return { role:"ai", kind:"article", lead:"来啦，俺老孙给你整一段金陵城的文案。", title:"南京 · 六朝烟雨，一城故事", quote:"江南佳丽地，金陵帝王州。", body:"南京把历史揉进梧桐里。走过明城墙，沿秦淮河看灯影，再去中山陵的台阶上吹一会儿风。", follows:["再文艺一点","加几个冷门打卡点"] };
  const agent = AGENTS[agentId] || AGENTS.wukong;
  return { role:"ai", kind:"text", text:`${agent.name}记下了：「${text}」。要改语气、缩短，或换成另一件专业的事，直接说下一条就行。` };
}
function send(text) {
  const value = (text ?? state.draft).trim();
  if (!value) return;
  const thread = currentThread();
  thread.messages.push({ role:"user", kind:"text", text:value });
  thread.messages.push(makeReply(thread.agentId, value));
  thread.preview = value.slice(0, 36);
  if (thread.title === "新对话") thread.title = value.slice(0, 16);
  state.draft = "";
  render();
  const scroller = document.querySelector(".transcript");
  if (scroller) scroller.scrollTop = scroller.scrollHeight;
}
function confirmTask(index) {
  const thread = currentThread();
  const msg = thread.messages[index];
  if (!msg || msg.kind !== "task") return;
  if ((msg.skill === "film" || msg.skill === "mix") && !state.vip) { state.modal = "vip"; render(); return; }
  if (state.beans < msg.cost) { state.modal = "recharge"; toast("龙豆不足"); render(); return; }
  state.beans -= msg.cost;
  msg.phase = "running";
  msg.progress = 62;
  state.records.unshift({ title:msg.title, amount:-msg.cost, time:"刚刚" });
  state.tasks.unshift({ id:uid(), title:msg.title, kind:skillNameOf(msg.skill), status:"生成中", progress:62, time:"刚刚", tone:"#1d4e63", media: msg.skill === "image" || msg.skill === "retouch" ? "图片" : "视频" });
  toast("已开始生成，可在任务里查看");
  render();
}
function skillNameOf(id) { return { image:"图片创作", retouch:"AI 修图", film:"一键成片", mix:"智能混剪" }[id] || "创作"; }
function confirmStudio() {
  if (needsVip() && !state.vip) { state.modal = "vip"; render(); return; }
  const thread = currentThread();
  if (thread.agentId !== "creator") { openAgent("creator"); return; }
  const title = (document.getElementById("prompt") && document.getElementById("prompt").value.trim()) || TEMPLATES.find(t => t.id === state.template).name;
  thread.messages.push({ role:"user", kind:"text", text:title });
  thread.messages.push({ role:"ai", kind:"task", skill:state.studioTab, title, meta:studioMeta(), cost:costOfStudio(), phase:"confirm" });
  thread.preview = skillName() + " · 待确认";
  toast("已放进这次对话，确认后才扣龙豆");
  render();
}
function handoff(prompt) {
  let thread = state.threads.find(t => t.id === "t-creator");
  state.studioTab = /修图|衣服/.test(prompt) ? "retouch" : /视频|混剪/.test(prompt) ? "film" : "image";
  thread.messages.push({ role:"user", kind:"text", text:prompt });
  thread.messages.push({ role:"ai", kind:"task", skill:state.studioTab, title:prompt.slice(0, 32), meta:studioMeta(), cost:costOfStudio(), phase:"confirm" });
  go("#/chat/t-creator?panel=studio&tab=" + state.studioTab);
}
function openEnterprisePage(id) {
  const page = PAGES[id];
  const thread = currentThread();
  thread.messages.push({ role:"user", kind:"text", text:page.title });
  thread.messages.push({ role:"ai", kind:"page", title:page.title, body:page.body });
  render();
}
function recharge(tier) {
  state.beans += tier.beans;
  state.records.unshift({ title:"充值" + tier.name, amount:tier.beans, time:"刚刚" });
  state.orders.unshift({ title:`${tier.name} · ${beansText(tier.beans)}龙豆`, status:"已到账", time:"刚刚", no:"BD" + Date.now().toString(36).toUpperCase() });
  state.modal = null;
  toast("已充入 " + beansText(tier.beans) + " 龙豆");
  render();
}
function openVip() {
  state.vip = true;
  state.modal = null;
  toast("已在原型中开通创作 VIP，没有产生扣款");
  render();
}

function icon(name) {
  const paths = {
    search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/>',
    edit: '<path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/>',
    bell: '<path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 18a2 2 0 0 0 4 0"/>',
    side: '<path d="M4 5h16v14H4z"/><path d="M9 5v14"/>',
    attach: '<path d="M8 12.5l6.5-6.5a3 3 0 0 1 4.2 4.2l-7.8 7.8a4.5 4.5 0 0 1-6.4-6.4l7.2-7.1"/>',
    mic: '<rect x="9" y="3" width="6" height="10" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    chevron: '<path d="M9 6l6 6-6 6"/>',
    down: '<path d="M6 9l6 6 6-6"/>'
  };
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || ""}</svg>`;
}

function messageHtml(m, index) {
  if (m.role === "user") return `<div class="msg user"><div class="bubble">${esc(m.text)}</div></div>`;
  const head = `<div class="who-line"><span class="dot">悟</span><span>${esc(agentOf(currentThread()).name)}</span></div>`;
  let body = "";
  if (m.kind === "article") {
    body = `<article class="piece"><p class="lead">${esc(m.lead)}</p><h3>${esc(m.title)}</h3><blockquote>${esc(m.quote)}</blockquote><p>${esc(m.body)}</p></article>`;
  } else if (m.kind === "task") {
    const running = m.phase === "running";
    body = `<div class="task"><div class="kicker">${esc(skillNameOf(m.skill))} · ${running ? "生成中" : "待确认"}</div><h3>${esc(m.title)}</h3><p class="meta">${esc(m.meta)}</p><p class="cost">${running ? "已消耗" : "预计"} ${beansText(m.cost)} 龙豆</p>${running ? `<div class="bar"><i style="width:${m.progress || 62}%"></i></div><div class="row" style="margin-top:8px"><button class="ghost" data-go="#/tasks">查看任务</button></div>` : `<div class="row"><button class="ghost" data-act="studio" data-tab="${esc(m.skill)}">调整参数</button><button class="primary" style="width:auto" data-act="confirm" data-index="${index}">确认生成</button></div>`}</div>`;
  } else if (m.kind === "cite") {
    body = `<div class="cite"><div class="kicker">企业知识库 · 带来源</div><h3>${esc(m.title)}</h3><p>${esc(m.body)}</p><ul>${m.sources.map(s => `<li><button class="srcbtn" data-act="sources">${esc(s)}</button></li>`).join("")}</ul><p class="meta">${esc(m.note || "")}</p></div>`;
  } else if (m.kind === "handoff") {
    body = `<div class="handoff"><div class="kicker">交给创作小助手</div><p>${esc(m.text)}</p><button class="primary" style="width:auto" data-act="handoff" data-prompt="${esc(m.prompt)}">在创作小助手中继续</button></div>`;
  } else if (m.kind === "page") {
    body = `<div class="pagecard"><div class="kicker">诚迈科技</div><h3>${esc(m.title)}</h3><p style="white-space:pre-wrap">${esc(m.body)}</p>${m.title === "抽奖" ? `<div class="row" style="margin-top:8px"><button class="primary" style="width:auto" data-act="join">${state.joined ? "已参加" : "参加"}</button></div>` : ""}</div>`;
  } else if (m.kind === "permission") {
    body = `<div class="perm"><div class="kicker">无穹科技 · 权限</div><p class="meta">权限就在这条对话里，可以直接开关。</p>
      ${[["kb","知识库可读"],["cs","客服可回复"],["ex","创作可导出"]].map(([id,name]) => `<div class="perm-row"><span>${name}</span><button class="switch${state.perms[id] ? " on" : ""}" data-act="perm" data-id="${id}" aria-pressed="${state.perms[id]}"><i></i></button></div>`).join("")}
    </div>`;
  } else body = `<div class="piece"><p style="white-space:pre-wrap;margin:0">${esc(m.text)}</p></div>`;
  const follows = (m.follows || []).map(f => `<button data-act="send" data-text="${esc(f)}">${esc(f)}</button>`).join("");
  const tools = m.kind === "permission" ? "" : `<div class="actions"><button class="textbtn" data-act="copy" data-index="${index}">复制</button><button class="textbtn" data-act="read">朗读</button><button class="textbtn" data-act="share">分享</button></div>`;
  return `<div class="msg">${head}${body}${tools}${follows ? `<div class="follow">${follows}</div>` : ""}</div>`;
}

function studioPanel() {
  const tab = state.studioTab;
  const tabs = [["image","图片创作"],["retouch","AI 修图"],["film","一键成片"],["mix","智能混剪"]];
  let fields = "";
  if (tab === "image" || tab === "film") {
    fields += `<div class="field"><span>模板</span><div class="choices">${TEMPLATES.map(t => `<button type="button" class="choice${state.template===t.id?" on":""}" data-act="template" data-id="${t.id}"><b>${t.name}</b><i>${t.note}</i></button>`).join("")}</div></div>`;
  }

  if (state.modal === "partner") return partnerModal();
  if (state.modal === "recharge") return `<div class="modal-back"><div class="modal" role="dialog" aria-label="购买龙豆"><h3>龙豆不足</h3><p class="meta">余额 ${beansText(state.beans)}。选择档位后只在这个原型里到账。</p><div class="tiers">${TIERS.slice(0,3).map(t => `<button class="card" data-act="tier" data-id="${t.id}"><b>${t.name}</b><i>${beansText(t.beans)} 龙豆 · ${t.price} 元</i></button>`).join("")}</div><div class="row" style="margin-top:12px"><button class="ghost" data-act="close-modal">取消</button><button class="textbtn" data-act="account" data-tab="beans">全部档位</button></div></div></div>`;
  if (state.modal === "vip") return `<div class="modal-back"><div class="modal" role="dialog"><h3>创作 VIP</h3><p>一键成片按每秒 12,000 龙豆，智能混剪每条 60,000 龙豆。普通会员不能使用这两项。</p><div class="row"><button class="ghost" data-act="close-modal">先不开通</button><button class="primary" style="width:auto" data-act="vip">在原型中开通</button></div></div></div>`;
  if (state.modal === "share") return `<div class="modal-back"><div class="modal" role="dialog"><h3>分享这则对话</h3><div class="row"><button class="ghost" data-act="toast" data-text="链接已复制">复制链接</button><button class="ghost" data-act="toast" data-text="已分享给微信好友">微信好友</button><button class="ghost" data-act="toast" data-text="已分享到朋友圈">朋友圈</button><button class="ghost" data-act="toast" data-text="长图已生成">分享长图</button></div><div class="row" style="margin-top:12px"><button class="textbtn" data-act="close-modal">关闭</button></div></div></div>`;
  if (state.modal === "call") return `<div class="modal-back"><div class="modal call" role="dialog" aria-label="语音通话"><div class="pulse">悟</div><h3>正在听</h3><p class="meta">可以打断，也可以打字补充。说完后会转成文字，留在这次通话里。</p><p>「帮我把刚才的南京文案再收短一点。」</p><div class="row" style="justify-content:center"><button class="ghost" data-act="toast" data-text="已静音">静音</button><button class="ghost" data-act="toast" data-text="已打断回答">打断</button><button class="primary" style="width:auto" data-act="close-modal">结束通话</button></div><p class="meta">示意界面，不会真正录音。</p></div></div>`;
  if (state.modal === "work") {
    const w = state.works.find(x => x.id === state.workId) || state.works[0];
    return `<div class="modal-back"><div class="modal" role="dialog" aria-label="${esc(w.title)}"><div style="border-radius:12px;overflow:hidden">${coverSvg(w)}</div><h3 style="margin-top:12px">${esc(w.title)}</h3><p class="meta">${esc(w.author)} · ${esc(w.kind)} · ${w.likes} 赞</p><div class="row">${w.mine && w.kind==="图片" ? `<button class="ghost" data-act="edit-work">修图</button>` : ""}${w.mine && w.kind==="视频" ? `<button class="ghost" data-act="mix-work">混剪</button>` : `<button class="ghost" data-act="toast" data-text="已收藏">收藏</button>`}<button class="ghost" data-act="toast" data-text="已开始下载">下载</button><button class="textbtn" data-act="close-modal">关闭</button></div></div></div>`;
  }
  if (state.modal === "feedback") return `<div class="modal-back"><div class="modal" role="dialog"><h3>问题反馈</h3><div class="filters">${["功能异常","体验问题","产品建议","其他"].map(n => `<button data-act="toast" data-text="已选择${n}">${n}</button>`).join("")}</div><textarea id="fb" rows="4" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)" placeholder="描述你遇到的问题"></textarea><div class="row" style="margin-top:10px"><button class="ghost" data-act="close-modal">取消</button><button class="primary" style="width:auto" data-act="toast" data-text="反馈已提交">提交</button></div></div></div>`;
  return "";
}

function render() {
  document.documentElement.dataset.theme = state.theme === "ink" ? "ink" : "paper";
  const main = state.view === "partners" ? partnersView()
    : state.view === "tasks" ? tasksView()
    : state.view === "works" ? worksView()
    : state.view === "plaza" ? plazaView()
    : chatView();
  const collapsed = state.collapsed ? "style=\"display:none\"" : "";
  const veil = !state.collapsed && narrow() ? `<button class="side-backdrop" data-act="collapse" aria-label="关闭菜单"></button>` : "";
  document.getElementById("app").innerHTML = veil + (state.collapsed ? "" : sidebar()) + main + modalHtml();
  const q = document.getElementById("q");
  if (q && state.focus === "q") { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  const composer = document.getElementById("composer");
  if (composer && state.focus === "composer") composer.focus();
  const aq = document.getElementById("account-q");
  if (aq && state.focus === "account-q") { aq.focus(); aq.setSelectionRange(aq.value.length, aq.value.length); }
}

function textOfMessage(m) {
  if (!m) return "";
  return [m.text, m.lead, m.title, m.quote, m.body, m.note].filter(Boolean).join("\n");
}
function onAct(act, el) {
  const id = el.dataset.id;
  if (act === "new") return newChat();
  if (act === "open-plaza") {
    state.workspace = "personal";
    state.panel = null;
    return go("#/chat/" + blankPersonalChat().id);
  }
  if (act === "account") return openAccount(el.dataset.tab || "home");
  if (act === "account-tab") { state.accountTab = id || "home"; state.modal = "account"; return render(); }
  if (act === "open-partner") return openPartner(id);
  if (act === "share-partner") return toast("链接已复制");
  if (act === "ask-agent") {
    const agent = AGENTS[id];
    if (!agent || agent.retired) return toast("这个智能体已下架");
    if (!agent.owned) {
      if (agent.cost) return toast("先在详情里领取这个工作伙伴");
      agent.owned = true;
      toast("已领取「" + agent.name + "」");
    }
    state.draft = el.dataset.text || "";
    state.modal = null;
    state.focus = "composer";
    return openAgent(id);
  }
  if (act === "ws") { state.wsMenu = !state.wsMenu; return render(); }
  if (act === "collapse") { state.collapsed = !state.collapsed; return render(); }
  if (act === "notices") { state.noticeOpen = !state.noticeOpen; return render(); }
  if (act === "read-notice") { toast("已读"); state.noticeOpen = false; return render(); }
  if (act === "share") { state.modal = "share"; return render(); }
  if (act === "call") { state.modal = "call"; return render(); }
  if (act === "attach") return toast("可添加照片、视频或文件。原型不会上传到服务器。");
  if (act === "close-modal") { state.modal = null; return render(); }
  if (act === "close-panel") { state.panel = null; history.replaceState(null, "", location.pathname + location.hash.split("?")[0]); return render(); }
  if (act === "send") return send(el.dataset.text);
  if (act === "skill") {
    if (el.dataset.tab) { state.studioTab = el.dataset.tab; state.panel = "studio"; render(); return; }
    if (el.dataset.hint) state.draft = el.dataset.hint;
    state.focus = "composer";
    return render();
  }
  if (act === "studio") { state.studioTab = el.dataset.tab || "image"; state.panel = "studio"; return render(); }
  if (act === "stab") { state.studioTab = id; return render(); }
  if (act === "template") { state.template = id; return render(); }
  if (act === "ratio") { state.ratio = id; return render(); }
  if (act === "count") { state.count = Number(id); return render(); }
  if (act === "duration") { state.duration = Number(id); return render(); }
  if (act === "mix") { state.mixStyle = id; return render(); }
  if (act === "voice") { state.voice = id; return render(); }
  if (act === "upload") { state.refs = Math.min(5, state.refs + 1); toast("已添加素材"); return render(); }
  if (act === "polish") { toast("已润色描述"); const p = document.getElementById("prompt"); if (p) p.value = "画面干净，光线自然，适合直接使用。" + p.value; return; }
  if (act === "analyze") { state.analyzed = true; toast("分析完成，请选择成片思路"); return render(); }
  if (act === "studio-confirm") return confirmStudio();
  if (act === "confirm") return confirmTask(Number(el.dataset.index));
  if (act === "sources") { state.panel = "sources"; return render(); }
  if (act === "handoff") return handoff(el.dataset.prompt || "做一张南京城市宣传图");
  if (act === "copy") { const m = currentThread().messages[Number(el.dataset.index)]; toast("已复制"); if (navigator.clipboard) navigator.clipboard.writeText(textOfMessage(m)).catch(() => {}); return; }
  if (act === "read") return toast("这段话暂时不能朗读");
  if (act === "page") return openEnterprisePage(id);
  if (act === "perm") { state.perms[el.dataset.id] = !state.perms[el.dataset.id]; return render(); }
  if (act === "join") { state.joined = true; toast("已参加，这是原型示例"); return render(); }
  if (act === "cat") { state.cat = id; return render(); }
  if (act === "sub") return subscribe(id);
  if (act === "use") return openAgent(id);
  if (act === "plaza") { state.plazaFilter = id || "全部"; render(); revealPlaza(); return; }
  if (act === "plaza-down") { revealPlaza(); return; }
  if (act === "chips-next") { const row = document.querySelector(".yt-bar-scroll"); if (row) row.scrollBy({ left: 220, behavior: "smooth" }); return; }
  if (act === "worktab") { state.workTab = id; return render(); }
  if (act === "open-work") { state.workId = id; state.modal = "work"; return render(); }
  if (act === "edit-work") { state.modal = null; state.studioTab = "retouch"; go("#/chat/t-creator?panel=studio&tab=retouch"); return; }
  if (act === "mix-work") { state.modal = null; state.studioTab = "mix"; go("#/chat/t-creator?panel=studio&tab=mix"); return; }
  if (act === "tier") return recharge(TIERS.find(t => t.id === id));
  if (act === "vip") { if (!state.vip) return openVip(); return; }
  if (act === "memory") { state.memoryOn = !state.memoryOn; return render(); }
  if (act === "save-call") { const v = document.getElementById("callme"); if (v) state.callMe = v.value.trim() || "主人"; toast("称呼已保存"); return; }
  if (act === "theme") { state.theme = id; return render(); }
  if (act === "invite") return toast("邀请码已复制");
  if (act === "feedback") { state.modal = "feedback"; return render(); }
  if (act === "logout") return toast("原型保持登录，方便继续查看");
  if (act === "toast") { toast(el.dataset.text || "已完成"); state.modal = null; return render(); }
}

document.getElementById("app").addEventListener("click", event => {
  if (event.target.classList && event.target.classList.contains("modal-back")) {
    state.modal = null;
    render();
    return;
  }
  const goEl = event.target.closest("[data-go]");
  if (goEl) { go(goEl.dataset.go); return; }
  const actEl = event.target.closest("[data-act]");
  if (!actEl || actEl.dataset.act === "submit") return;
  onAct(actEl.dataset.act, actEl);
});
document.getElementById("app").addEventListener("submit", event => {
  const form = event.target.closest("form");
  if (!form) return;
  event.preventDefault();
  send();
});
document.getElementById("app").addEventListener("input", event => {
  if (event.target.id === "q") { state.q = event.target.value; state.focus = "q"; render(); }
  if (event.target.id === "account-q") { state.accountQuery = event.target.value; state.focus = "account-q"; render(); }
  if (event.target.id === "composer") state.draft = event.target.value;
  if (event.target.id === "product") state.product = event.target.value;
  if (event.target.id === "points") state.points = event.target.value;
});
document.getElementById("app").addEventListener("keydown", event => {
  if (event.target.id === "composer" && event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && state.modal) {
    state.modal = null;
    render();
    return;
  }
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    state.focus = "q";
    if (state.view !== "chat" && state.view !== "partners") go("#/chat/" + (currentThread() ? currentThread().id : "t-nanjing"));
    else render();
  }
});
window.addEventListener("hashchange", applyRoute);
seed();
if (narrow()) state.collapsed = true;
if (!location.hash) location.hash = "#/chat/t-nanjing";
else applyRoute();
</script>
</body>
</html>
